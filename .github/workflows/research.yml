name: Réglage du modèle
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script à lancer"
        default: research.py
        type: choice
        options: [research.py, research_elo.py]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: research-${{ github.run_id }}
          restore-keys: research-
      - run: python ${{ inputs.script || 'research.py' }}
