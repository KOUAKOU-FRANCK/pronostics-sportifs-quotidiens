name: Pronos quotidiens
on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h UTC (8h heure de Paris en été)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: python build.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Publier
        run: |
          git config user.name "pronos-bot"
          git config user.email "pronos-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Pronos du $(date -u +%F)"
          git push
